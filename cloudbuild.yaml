steps:
  # Dockerイメージをビルド
  - name: "gcr.io/cloud-builders/docker"
    args:
      ["build", "-t", "gcr.io/$PROJECT_ID/mahjong-manager-bot:$COMMIT_SHA", "."]

  # Container Registryにプッシュ
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/mahjong-manager-bot:$COMMIT_SHA"]

  # Cloud Runにデプロイ
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "mahjong-manager-bot"
      - "--image"
      - "gcr.io/$PROJECT_ID/mahjong-manager-bot:$COMMIT_SHA"
      - "--region"
      - "asia-northeast1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--max-instances"
      - "10"
      - "--timeout"
      - "300"
      - "--set-env-vars"
      - "FLASK_ENV=production,PORT=8080"

images:
  - "gcr.io/$PROJECT_ID/mahjong-manager-bot:$COMMIT_SHA"
