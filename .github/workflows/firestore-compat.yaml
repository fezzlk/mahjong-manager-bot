name: Firestore Compatibility Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  firestore-compat:
    runs-on: ubuntu-latest
    if: ${{ vars.FIRESTORE_COMPAT_ENABLED == 'true' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.14"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_FIRESTORE_TEST }}

      - name: Run Firestore compatibility tests
        env:
          FIRESTORE_TEST_DATABASE_URL: ${{ secrets.FIRESTORE_TEST_DATABASE_URL }}
          FIRESTORE_TEST_DATABASE_NAME: mahjong-manager-test
        run: |
          pytest tests/firestore_compat/ -v

      - name: Test summary
        if: always()
        run: echo "Firestore compatibility tests completed"
