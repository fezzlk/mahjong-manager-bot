name: E2E Tests (Playwright)

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 手動実行も可能

jobs:
  playwright:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11.14"]
        mongodb-version: ["8.0"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-e2e-${{ hashFiles('requirements.txt', 'requirements.e2e.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-e2e-
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.e2e.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.7.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-port: 27017

      - name: Run Playwright E2E tests
        env:
          YOUR_CHANNEL_ACCESS_TOKEN: ci-dummy-token
          YOUR_CHANNEL_SECRET: ci-dummy-channel
          DATABASE_URL: mongodb://localhost:27017/?authSource=admin
          DATABASE_NAME: test_e2e
          SERVER_URL: http://localhost:5099/
          FLASK_SECRET_KEY: ci-e2e-key
          JWT_SECRET_KEY: ci-e2e-jwt-key
          FLASK_ENV: testing
        run: |
          pytest tests/e2e/playwright/ -v --tb=short

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
